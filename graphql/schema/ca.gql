# ═══════════════════════════════════════════════════════════════════
# CA (Campus Ambassador) GraphQL Schema
# ═══════════════════════════════════════════════════════════════════

"""
CA Application status
"""
enum CAApplicationStatus {
  PENDING
  ACCEPTED
  REJECTED
}

"""
CA Application data
"""
type CaApplication {
  id: ID!
  status: CAApplicationStatus!
  rejectionReason: String
  appliedAt: String!
  updatedAt: String!
}

"""
CA Profile data (created when application is approved)
"""
type CaProfile {
  id: ID!
  referralId: String!
  numberOfReferrals: Int!
  approvedAt: String!
}

"""
Complete CA info - frontend queries only fields it needs
"""
type MyCaInfo {
  hasApplied: Boolean!
  application: CaApplication
  profile: CaProfile
}
