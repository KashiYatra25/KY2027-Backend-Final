# ═══════════════════════════════════════════════════════════════════
# MY ACCOUNT QUERIES - Raw GraphQL for Postman
# ═══════════════════════════════════════════════════════════════════
# Copy any query below and paste in Postman GraphQL body
# Don't forget to add: Authorization: Bearer <token>
# ═══════════════════════════════════════════════════════════════════


# ───────────────────────────────────────────────────────────────────
# FULL QUERY - Everything
# ───────────────────────────────────────────────────────────────────

query GetMyAccountFull {
  myAccount {
    profile {
      id
      email
      firstName
      lastName
      slugName
      avatarUrl
      phone
      gender
      college
      dob
      joinedAt
      adhaarNumber
      role {
        id
        level
      }
    }
    progress {
      steps {
        aadhaarUploaded
        aadhaarVerified
        college
        phone
      }
      completedSteps
      totalSteps
      completionPercentage
      currentStep
      isProfileComplete
      accountStatus
    }
  }
}


